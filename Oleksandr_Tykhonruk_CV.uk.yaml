  sections:
    Опис:
      - Понад 20 років досвіду у сфері розробки, впровадження та трансформації інформаційних систем, автоматизації процесів, системного аналізу та технічного лідерства. Досвід реалізації комплексних ІТ-проєктів у телекомунікаційній, фінансовій, логістичній, e-commerce та інших сферах. Практичний досвід аналізу та формалізації вимог, проєктування архітектури інформаційних систем, системної інтеграції, міграції даних, модернізації legacy-систем та управління технічними командами. Понад 1,5 року військового досвіду впровадження SAP ERP у Силах оборони України.

    Професійний досвід:
      - company: Міністерство оборони України
        position: Відповідальний виконавець
        start_date: 2025-04
        end_date: 2026-08
        location: Київ, Україна
        summary: Впровадження та модернізація системи управління логістичним забезпеченням Сил оборони України.
        highlights:
          - Створював навчальний контент та технічну документацію
          - Навчав користувачів за напрямком тилового забезпечення

      - company: SkyFi
        position: Staff Software Engineer
        start_date: 2022-03
        end_date: 2022-11
        location: Remote
        summary: Платформа комерційних супутникових знімків та даних дистанційного зондування Землі.
        highlights:
          - Проєктував та реалізовував інформаційні системи для обробки, трансформації та розповсюдження супутникових даних.
          - Розробляв автоматизовані процеси обробки великих масивів даних та інтеграції компонентів системи.

      - company: Takeoff Technologies Inc
        position: Technical Lead
        start_date: 2019-03
        end_date: 2021-08
        location: Remote
        summary: Платформа автоматизованого виконання замовлень у роздрібній торгівлі з використанням роботизованих мікро-фулфілмент центрів.
        highlights:
          - Керував технічною командою, відповідальною за інформаційні системи процесів управління запасами та приймання товарів.
          - Брав участь у трансформації legacy-системи та декомпозиції монолітної архітектури на окремі керовані сервіси.
          - Впровадив систему автоматизованого контролю складських залишків (cycle counting).
          - Брав участь у модернізації операційних процесів та користувацьких інтерфейсів, що дозволило зменшити кількість помилок і суттєво підвищити продуктивність операторів.

      - company: Wargaming
        position: Senior Software Engineer
        start_date: 2018-04
        end_date: 2019-03
        location: Київ, Україна
        summary: Розробка та розвиток онлайн-гри World of Tanks.
        highlights:
          - Розробляв нові ігрові режими на основі ШІ
          - Розробляв внутрішні інструменти для управління ігровим контентом.

      - company: Ocean.io
        position: Team Lead
        start_date: 2017-06
        end_date: 2018-01
        location: Київ, Україна
        summary: Платформа збору та агрегації глобальних ринкових даних.
        highlights:
          - Керував командою, відповідальною за збір та обробку великих масивів даних.
          - Проєктував та впроваджував систему планування й автоматизації масштабних процесів збору даних.
          - Організував автоматизовану обробку даних у масштабі близько 100 тисяч веб-доменів на тиждень.

      - company: Sportech LLC
        position: Technical Project Manager
        start_date: 2016-12
        end_date: 2017-05
        location: Київ, Україна
        summary: Високонавантажена SaaS-платформа для спортивної аналітики та автоматизації операцій.
        highlights:
          - Керував розробленням та впровадженням інформаційних рішень для збору даних, автоматизації операцій та аналітики.
          - Координував роботу технічної команди та проєктування системних рішень.

      - company: kvartirkov.com
        position: Lead Developer
        start_date: 2014-03
        end_date: 2016-05
        location: Київ, Україна
        summary: Онлайн сервіс оренди нерухомості та онлайн-бронювання.
        highlights:
          - Повністю перепроєктував та реалізував сервіс оренди нерухомості.
          - Брав участь у проєктуванні бізнес-процесів та реалізації функціональності системи.

      - company: IBS Ltd.
        position: Lead Developer
        start_date: 2013-09
        end_date: 2014-03
        location: Київ, Україна
        summary: Корпоративне банківське програмне забезпечення та інтеграція фінансових систем.
        highlights:
          - Спроєктував та розробив систему інтернет-банкінгу для українського комерційного банку.
          - Проєктував інтеграцію між компонентами інформаційної системи та зовнішніми корпоративними сервісами.

      - company: ArtOfBytes UG
        position: Software Engineer
        start_date: 2012-04
        end_date: 2013-04
        location: Remote
        summary: Розроблення та експлуатація backend-частини багатокористувацьких мобільних ігор.
        highlights:
          - Розробив, впровадив та забезпечував експлуатацію backend багатокористувацької гри.
          - Інтегрував зовнішні сервіси, зокрема платіжні, геолокаційні та соціальні платформи.

      - company: UMC (нині Vodafone Ukraine)
        position: Systems Analyst
        start_date: 2006-02
        end_date: 2011-06
        location: Київ, Україна
        summary: Національний оператор телекомунікацій, департамент розвитку білінгових платформ.
        highlights:
          - Брав участь у ключових проєктах розвитку інформаційних систем оператора як системний аналітик та технічний керівник проєктів.
          - Виконував збір і формалізацію вимог, системний аналіз, технічне проєктування, підготовку документації та координацію реалізації.
          - Спроєктував та впровадив інформаційні системи та сервіси Money Transfer, Prepaid Personal Data Collection і Campaign Management.
          - Інтегрував USSD-платформу з billing-системою та впровадив GPRS online charging і CLIR.
          - Керував міграцією понад 20 млн абонентів передплаченого зв'язку на нову білінгову платформу.
          - Автоматизував процеси повторного використання SIM-карт.
          - Брав участь у впровадженні інформаційних систем та сервісів для управління мобільною мережею.

      - company: Active 97 Ltd
        position: Data Engineer
        start_date: 2000-07
        end_date: 2005-01
        location: Київ, Україна
        summary: Дослідницька та аналітична компанія у сфері FMCG та роздрібної торгівлі.
        highlights:
          - Проєктував та розробляв сховища даних, автоматизовані процеси ETL і системи звітності.
          - Автоматизував розрахункові процеси та інтеграцію інформаційних систем.

